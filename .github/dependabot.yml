# Bağımlılıklarda güvenlik açığı çıkarsa güncelleme önerisi (pull request) açılır.
# Sürüm güncellemeleri ayda bir ve tek PR'da toplanır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
